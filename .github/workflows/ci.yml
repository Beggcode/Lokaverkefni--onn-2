name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @ntv/shared build

      - name: Type check
        run: pnpm --filter client exec tsc -b --noEmit

      - name: Lint
        run: pnpm --filter client lint

      - name: Test
        run: pnpm --filter client exec vitest run
